<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100">
    <div class="bg-white max-w-md mx-auto rounded-lg ">
        <div class="bg-indigo-500 p-5 rounded-md">
        <h1>Todo App</h1>
        </div>
       <div class="p-5">
         <form action="" class="flex gap-5" id="form">
                <input id="inp" placeholder="Enter task description" type="text" class="flex-1 border border-black p-2">
            <button id="form-button" class="p-2 bg-violet-700 text-white py-3 px-5 rounded-md" type="submit">Add</button>
        </form>
       </div>
        <div class="flex justify-between pt-6 pb-1 text-xs border-b border-black ">
            <p id="t-count">Tasks(0)</p>
            <p id="c-count">Completed :0</p>
        </div>
        <ul class="py-5 flex flex-col gap-3" id="list">
            <!-- <li class="flex gap-2 border border-slate-300 p-4 rounded-md">
                <input type="checkbox">
            <p class="flex-1">Go to gym</p>
            <div>
                <button>Edit</button>
                <button>Delete</button>
            </div>
            </li> -->
        </ul>
    </div>
    <script src="index.js"></script>
</body>
</html>
